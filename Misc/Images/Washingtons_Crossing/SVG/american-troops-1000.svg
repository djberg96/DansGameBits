<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">American troops 1000</title>
  <desc id="desc">Vector recreation of the American troops 1000 counter from Washington's Crossing.</desc>
  <defs>
