<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Turn Now — Manchester's force</title>
  <desc id="desc">A vector recreation of a counter from Cromwell's Victory.</desc>
  <style>
    text { fill: #111510; font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
    .name { font-weight: 700; text-anchor: middle; }
    .setup { font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    .factors { font-size: 18px; font-weight: 800; text-anchor: middle; letter-spacing: -0.25px; }
    .turn { font-size: 17px; font-weight: 800; text-anchor: middle; }
  </style>
  <rect x="0.5" y="0.5" width="99" height="99" fill="#DC5964" stroke="#263326" stroke-width="1"/>
  <text class="turn" x="50" y="45">Turn</text>
<text class="turn" x="50" y="63">Now</text>
  
  
  
</svg>
