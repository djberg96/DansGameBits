<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Skirmish — Return marker</title>
  <desc id="desc">A neutral marker showing crossed muskets, used to reserve a skirmishing unit's return hex.</desc>
  <style>
    text {
      fill: #111510;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      text-anchor: middle;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.25px;
    }
    .return {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.25px;
    }
  </style>

  <rect x="0.5" y="0.5" width="99" height="99" fill="#D9C28E" stroke="#263326" stroke-width="1"/>
  <text class="title" x="50" y="20">SKIRMISH</text>

  <defs>
    <g id="musket" fill="#111510">
      <!-- Barrel and muzzle band -->
      <rect x="48.3" y="27" width="3.4" height="38" rx="1.4"/>
      <rect x="46.9" y="27" width="6.2" height="3.2" rx="0.8"/>
      <!-- Lock and cock -->
      <rect x="47.1" y="54" width="7.1" height="5.2" rx="1.3"/>
      <path d="M53.1 54.8 L56.5 51.7 L58.2 53.5 L54.2 57.1 Z"/>
      <!-- Wooden stock and butt -->
      <path d="M48.2 60.5 L52.1 60.5 L53.1 66.8 L58.3 73.6
               C59.2 74.8 58.8 76.3 57.4 76.8
               L51.8 78.9 C50.1 79.5 48.3 78.7 47.7 77.1
               L46.1 72.8 L47.7 66.4 Z"/>
      <!-- Trigger guard -->
      <path d="M48.7 60.2 C44.7 61.2 44.9 65.9 48.4 66.3"
            fill="none" stroke="#111510" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </defs>

  <g transform="rotate(-43 50 53)">
    <use href="#musket"/>
  </g>
  <g transform="rotate(43 50 53)">
    <use href="#musket"/>
  </g>

  <circle cx="50" cy="53" r="3.2" fill="#D9C28E" stroke="#111510" stroke-width="1.5"/>
  <text class="return" x="50" y="91">RETURN</text>
</svg>
