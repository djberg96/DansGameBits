<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">American leader: Griffin</title>
  <desc id="desc">Vector recreation of the American leader: Griffin counter from Washington's Crossing.</desc>
  <defs>
    <pattern id="blueTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#083d4c"/>
      <path d="M0 1H6 M0 4H6" stroke="#b7d0c6" stroke-opacity=".11" stroke-width="0.33"/>
      <path d="M1.67 0V6 M4.67 0V6" stroke="#d3e0d2" stroke-opacity=".08" stroke-width="0.33"/>
    </pattern>
        <pattern id="americanLeaderTexture" width="14" height="14" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#083d4c"/>
          <text x="3.33" y="5" fill="#b7d0c6" fill-opacity=".11" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
          <text x="10.33" y="11.67" fill="#b7d0c6" fill-opacity=".08" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
          <text x="13.33" y="2.67" fill="#b7d0c6" fill-opacity=".05" font-family="Georgia, serif" font-size="3" text-anchor="middle">★</text>
        </pattern>
    <pattern id="redTexture" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d94234"/>
      <path d="M0 0L8 8M8 0L0 8" stroke="#ffc0a4" stroke-opacity=".14" stroke-width="0.67"/>
      <path d="M2 0V8M6 0V8" stroke="#831e22" stroke-opacity=".14" stroke-width="0.67"/>
    </pattern>
    <pattern id="blackTexture" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="4" height="4" fill="#101214"/>
      <path d="M0 0.67H4" stroke="#6a6a6a" stroke-opacity=".35" stroke-width="0.33"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.67" stdDeviation="0.67" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#americanLeaderTexture)"/>
<text x="14.33" y="21.67" fill="#fff" font-family="Georgia, serif" font-size="21.33" text-anchor="middle">1</text><text x="50" y="25.33" fill="#fff" font-family="Georgia, serif" font-size="17.33" text-anchor="middle">★</text><text x="85.67" y="21.67" fill="#fff" font-family="Georgia, serif" font-size="21.33" text-anchor="middle">1</text>
<rect y="37.33" width="100" height="20.67" fill="#c9283e"/>
<text x="50" y="52" fill="#fff" font-family="Arial, sans-serif" font-size="12.67" font-weight="bold" text-anchor="middle">Griffin</text>
  <rect x="25" y="58.67" width="50" height="12" fill="#f7f6f0"/>
<text x="14.33" y="86.67" fill="#fff" font-family="Georgia, serif" font-size="21.33" text-anchor="middle">3</text>
<text x="85.67" y="89.33" fill="#fff" font-family="Georgia, serif" font-size="21.33" text-anchor="middle">1</text>

</svg>
