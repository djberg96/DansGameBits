<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">American Activation Points</title>
  <desc id="desc">Vector recreation of the American Activation Points marker from Washington's Crossing.</desc>
  <defs>
    <pattern id="americanStarTexture" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#083d4c"/>
      <text x="3.33" y="5" fill="#b7d0c6" fill-opacity=".11" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
      <text x="10.33" y="11.67" fill="#b7d0c6" fill-opacity=".08" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
      <text x="13.33" y="2.67" fill="#b7d0c6" fill-opacity=".05" font-family="Georgia, serif" font-size="3" text-anchor="middle">★</text>
    </pattern>
  </defs>

  <rect width="100" height="100" fill="url(#americanStarTexture)"/>

  <g font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <g fill="#071f29" fill-opacity=".55">
      <text x="51" y="42" font-size="13">Activation</text>
      <text x="51" y="58" font-size="14">POINTS</text>
      <text x="51" y="74" font-size="14">(AP)</text>
    </g>
    <g fill="#fff4e8">
      <text x="50" y="41" font-size="13">Activation</text>
      <text x="50" y="57" font-size="14">POINTS</text>
      <text x="50" y="73" font-size="14">(AP)</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="#fff" stroke-width="1"/>
</svg>
