<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">British troops 100</title>
  <desc id="desc">Vector recreation of the British troops 100 counter from Washington's Crossing.</desc>
  <defs>
    <pattern id="blueTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#083d4c"/>
      <path d="M0 1H6 M0 4H6" stroke="#b7d0c6" stroke-opacity=".11" stroke-width="0.33"/>
      <path d="M1.67 0V6 M4.67 0V6" stroke="#d3e0d2" stroke-opacity=".08" stroke-width="0.33"/>
    </pattern>
    <pattern id="redTexture" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d94234"/>
      <path d="M0 0L8 8M8 0L0 8" stroke="#ffc0a4" stroke-opacity=".14" stroke-width="0.67"/>
      <path d="M2 0V8M6 0V8" stroke="#831e22" stroke-opacity=".14" stroke-width="0.67"/>
    </pattern>
    <pattern id="blackTexture" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="4" height="4" fill="#101214"/>
      <path d="M0 0.67H4" stroke="#6a6a6a" stroke-opacity=".35" stroke-width="0.33"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.67" stdDeviation="0.67" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#redTexture)"/>
<text x="50" y="21" fill="#f8f4e9" font-family="Arial, sans-serif" font-size="16" letter-spacing="0.5" text-anchor="middle">TROOPS</text>
<g filter="url(#shadow)">  <rect x="30.33" y="31.33" width="39.33" height="20.67" fill="#243e80" stroke="#eee"/>  <path d="M30.33 31.33L69.67 52M69.67 31.33L30.33 52" stroke="#fff" stroke-width="4.67"/>  <path d="M30.33 31.33L69.67 52M69.67 31.33L30.33 52" stroke="#d63136" stroke-width="2"/>  <path d="M50 31.33V52M30.33 41.67H69.67" stroke="#fff" stroke-width="8"/>  <path d="M50 31.33V52M30.33 41.67H69.67" stroke="#d63136" stroke-width="4"/></g>
<text x="50" y="81.67" fill="#fff" font-family="Georgia, serif" font-size="25.33" font-weight="bold" text-anchor="middle">100</text>

