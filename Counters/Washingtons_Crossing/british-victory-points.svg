<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">British Victory Points</title>
  <desc id="desc">Vector recreation of the British Victory Points marker from Washington's Crossing.</desc>
  <defs>
    <pattern id="redStarTexture" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#db322c"/>
      <text x="3.33" y="5" fill="#ffd3b2" fill-opacity=".11" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
      <text x="10.33" y="11.67" fill="#ffd3b2" fill-opacity=".08" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
      <text x="13.33" y="2.67" fill="#ffd3b2" fill-opacity=".05" font-family="Georgia, serif" font-size="3" text-anchor="middle">★</text>
    </pattern>
  </defs>

  <rect width="100" height="100" fill="url(#redStarTexture)"/>
  <g transform="translate(50 57)" fill="none" stroke="#f2ceb0" stroke-opacity=".20" stroke-width="1.5">
    <path d="M-17-23h34l-3 9H-14z"/>
    <path d="M-13-23l5-7 8 7 8-7 5 7"/>
    <circle cx="-8" cy="-30" r="1.5" fill="#f2ceb0" fill-opacity=".20" stroke="none"/>
    <circle cy="-33" r="1.5" fill="#f2ceb0" fill-opacity=".20" stroke="none"/>
    <circle cx="8" cy="-30" r="1.5" fill="#f2ceb0" fill-opacity=".20" stroke="none"/>
    <path d="M-17-11q0 20 17 25 17-5 17-25v-8h-34z"/>
    <path d="M0-19v31M-17-3h34"/>
  </g>
  <text x="50" y="62" fill="#f2ceb0" fill-opacity=".18" font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">GR</text>

  <g font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <g fill="#631b20" fill-opacity=".55">
      <text x="51" y="39" font-size="14">Victory</text>
      <text x="51" y="56" font-size="15">POINTS</text>
      <text x="51" y="73" font-size="15">(VP)</text>
    </g>
    <g fill="#fff4e8">
      <text x="50" y="38" font-size="14">Victory</text>
      <text x="50" y="55" font-size="15">POINTS</text>
      <text x="50" y="72" font-size="15">(VP)</text>
    </g>
  </g>
</svg>
