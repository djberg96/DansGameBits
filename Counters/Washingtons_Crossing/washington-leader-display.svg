<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1300 100" role="img" aria-labelledby="title desc">
  <title id="title">Washington leader display</title>
  <desc id="desc">Fatigue track from zero to nine, with fatigue at zero, one hundred troops at one, and ten troops at four.</desc>
  <defs>
    <pattern id="trackTexture" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#183b46"/>
      <path d="M0 2H12M0 8H12M3 0V12M9 0V12" fill="none" stroke="#a9c1bc" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>

  <g fill="url(#trackTexture)" stroke="#9badad" stroke-opacity=".55" stroke-width="2">
    <rect x="0" y="0" width="100" height="100"/>
    <rect x="100" y="0" width="100" height="100"/>
    <rect x="200" y="0" width="100" height="100"/>
    <rect x="300" y="0" width="100" height="100"/>
    <rect x="400" y="0" width="100" height="100"/>
    <rect x="500" y="0" width="100" height="100"/>
    <rect x="600" y="0" width="100" height="100"/>
    <rect x="700" y="0" width="100" height="100"/>
    <rect x="800" y="0" width="100" height="100"/>
    <rect x="900" y="0" width="100" height="100"/>
  </g>
  <rect x="2" y="2" width="996" height="96" fill="none" stroke="#101214" stroke-width="4"/>

  <g fill="#f8f4e9" font-family="Times New Roman, Times, serif" font-size="62" text-anchor="middle">
    <text x="50" y="72">0</text>
    <text x="150" y="72">1</text>
    <text x="250" y="72">2</text>
    <text x="350" y="72">3</text>
    <text x="450" y="72">4</text>
    <text x="550" y="72">5</text>
    <text x="650" y="72">6</text>
    <text x="750" y="72">7</text>
    <text x="850" y="72">8</text>
    <text x="950" y="72">9</text>
  </g>

  <g fill="#050708" fill-opacity=".75">
    <rect x="13" y="13" width="82" height="82"/>
    <rect x="113" y="13" width="82" height="82"/>
    <rect x="413" y="13" width="82" height="82"/>
  </g>
  <image x="10" y="10" width="82" height="82" href="fatigue.svg" xlink:href="fatigue.svg"/>
  <image x="110" y="10" width="82" height="82" href="american-troops-100.svg" xlink:href="american-troops-100.svg"/>
  <image x="410" y="10" width="82" height="82" href="american-troops-10.svg" xlink:href="american-troops-10.svg"/>

  <text x="1030" y="60" fill="#111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31">Washington (140)</text>
</svg>
