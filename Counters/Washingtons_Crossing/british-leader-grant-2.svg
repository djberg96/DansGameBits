<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">British leader: Grant</title>
  <desc id="desc">Vector recreation of the British leader: Grant counter from Washington's Crossing.</desc>
  <defs>
    <pattern id="blueTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#083d4c"/>
      <path d="M0 1H6 M0 4H6" stroke="#b7d0c6" stroke-opacity=".11" stroke-width="0.33"/>
      <path d="M1.67 0V6 M4.67 0V6" stroke="#d3e0d2" stroke-opacity=".08" stroke-width="0.33"/>
    </pattern>
    <pattern id="redTexture" width="8" height="8" patternUnits="userSpaceOnUse">
