<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">British troops 10</title>
  <desc id="desc">Vector recreation of the British troops 10 counter from Washington's Crossing.</desc>
  <defs>
    <pattern id="blueTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#083d4c"/>
      <path d="M0 1H6 M0 4H6" stroke="#b7d0c6" stroke-opacity=".11" stroke-width="0.33"/>
      <path d="M1.67 0V6 M4.67 0V6" stroke="#d3e0d2" stroke-opacity=".08" stroke-width="0.33"/>
    </pattern>
        <pattern id="britishStarTexture" width="14" height="14" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#db322c"/>
          <text x="3.33" y="5" fill="#ffd3b2" fill-opacity=".11" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
          <text x="10.33" y="11.67" fill="#ffd3b2" fill-opacity=".08" font-family="Georgia, serif" font-size="4.33" text-anchor="middle">★</text>
          <text x="13.33" y="2.67" fill="#ffd3b2" fill-opacity=".05" font-family="Georgia, serif" font-size="3" text-anchor="middle">★</text>
        </pattern>
    <pattern id="redTexture" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d94234"/>
      <path d="M0 0L8 8M8 0L0 8" stroke="#ffc0a4" stroke-opacity=".14" stroke-width="0.67"/>
      <path d="M2 0V8M6 0V8" stroke="#831e22" stroke-opacity=".14" stroke-width="0.67"/>
    </pattern>
    <pattern id="blackTexture" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="4" height="4" fill="#101214"/>
      <path d="M0 0.67H4" stroke="#6a6a6a" stroke-opacity=".35" stroke-width="0.33"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.67" stdDeviation="0.67" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#britishStarTexture)"/>
<text x="50" y="28" fill="#f8f4e9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.5" text-anchor="middle">TROOPS</text>
<defs><clipPath id="britishFlagClip"><rect x="18.33" y="35" width="63.33" height="20.67"/></clipPath></defs><g filter="url(#shadow)">  <rect x="18.33" y="35" width="63.33" height="20.67" fill="#243e80" stroke="#eee"/>  <g clip-path="url(#britishFlagClip)">    <path d="M18.33 35L81.67 55.67M81.67 35L18.33 55.67" stroke="#fff" stroke-width="4.67"/>    <path d="M18.33 35L81.67 55.67M81.67 35L18.33 55.67" stroke="#d63136" stroke-width="2"/>  </g>  <path d="M50 35V55.67M18.33 45.33H81.67" stroke="#fff" stroke-width="8"/>  <path d="M50 35V55.67M18.33 45.33H81.67" stroke="#d63136" stroke-width="4"/></g>
<text x="50" y="86.67" fill="#fff" font-family="Times New Roman, Times, serif" font-size="32" text-anchor="middle">10</text>

  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="#000" stroke-width="1"/>
